<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evidență Șantiere</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--mut:#6b6a63;--bd:#dedbd0;--ac:#c2570c;--on:#fff;--bad:#b3261e;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--fg:#efede6;--card:#222220;--mut:#a09e94;--bd:#3a3935;--ac:#f08a3c;--on:#1a1a18;--bad:#ff8a80;--ok:#81c784}}
:root[data-theme="dark"]{--bg:#171715;--fg:#efede6;--card:#222220;--mut:#a09e94;--bd:#3a3935;--ac:#f08a3c;--on:#1a1a18;--bad:#ff8a80;--ok:#81c784}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button{font:inherit;background:var(--ac);color:var(--on);border:0;border-radius:7px;padding:8px 13px;cursor:pointer}

button.sm{padding:3px 8px;font-size:13px}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}

.ent{border-bottom:1px solid var(--bd);padding:10px 0}.ent:last-child{border:0}
</style></head><body><div id="app"></div>
<script>
/* ============================================================
   CONFIGURARE (versiunea de sine stătătoare, în afara Claude)
   - FIREBASE_CONFIG = null  -> mod LOCAL: datele rămân în browserul acesta.
   - FIREBASE_CONFIG = {...} -> mod ONLINE: datele sunt comune pentru toți
     utilizatorii, de pe orice browser/telefon (Firebase Firestore, gratuit).
   ============================================================ */
const FIREBASE_CONFIG = null;
/* exemplu:
const FIREBASE_CONFIG = {
  apiKey: "AIza...", authDomain: "proiect.firebaseapp.com", projectId: "proiect"
};
*/
</script>
<script>
(function(){
  var memStore={};
  var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]||null}},
          set:function(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=v}}};
  var P='sant:';
  function localDb(){
    var subs={};
    function load(n){try{return JSON.parse(ls.get(P+n)||'{}')}catch(e){return {}}}
    function save(n,o){ls.set(P+n,JSON.stringify(o))}
    function emit(n){var o=load(n);var docs=Object.keys(o).map(function(id){return {id:id,data:function(){return JSON.parse(JSON.stringify(o[id]))}}});(subs[n]||[]).forEach(function(f){f({docs:docs})})}
    window.addEventListener('storage',function(e){if(e.key&&e.key.indexOf(P)===0)emit(e.key.slice(P.length))});
    return {collection:function(n){return {
      doc:function(id){return {
        set:async function(d){var o=load(n);o[id]=JSON.parse(JSON.stringify(d));save(n,o);emit(n)},
        update:async function(d){var o=load(n);if(!o[id])throw new Error('Documentul nu există');o[id]=Object.assign({},o[id],JSON.parse(JSON.stringify(d)));save(n,o);emit(n)},
        delete:async function(){var o=load(n);delete o[id];save(n,o);emit(n)}
      }},
      onSnapshot:function(cb){(subs[n]=subs[n]||[]).push(cb);setTimeout(function(){emit(n)},0);return function(){subs[n]=subs[n].filter(function(f){return f!==cb})}}
    }}};
  }
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Nu s-a putut încărca '+src))};document.head.appendChild(s)})}
  async function fbDb(cfg){
    var v='10.12.2';
    await loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-firestore-compat.js');
    firebase.initializeApp(cfg);
    var f=firebase.firestore();
    f.settings({ignoreUndefinedProperties:true});
    try{await f.enablePersistence({synchronizeTabs:true})}catch(e){}
    return f;
  }
  var dbP=null;
  function getDb(){
    if(!dbP)dbP=(async function(){
      var online=typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG;
      if(!online){document.addEventListener('DOMContentLoaded',function(){var b=document.createElement('div');b.textContent='Mod local: datele sunt salvate doar în acest browser.';b.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#c2570c;color:#fff;font:12px system-ui;text-align:center;padding:3px;z-index:50;opacity:.9';b.onclick=function(){b.remove()};document.body.appendChild(b)});return localDb()}
      return fbDb(FIREBASE_CONFIG);
    })();
    return dbP;
  }
  var DL={save:async function(o){
    var t=/\.svg$/i.test(o.filename)?'image/svg+xml':/\.csv$/i.test(o.filename)?'text/csv;charset=utf-8':'text/html;charset=utf-8';
    var url=URL.createObjectURL(new Blob([o.data],{type:t}));
    var a=document.createElement('a');a.href=url;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},2000);
  }};
  window.claude={use:async function(n){return n==='db'?await getDb():DL}};
})();
</script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sid=s=>String(s).trim().replace(/[^A-Za-z0-9_.-]/g,'-');
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>Math.round(n*1000)/1000;
const S={users:[],sites:[],mats:[],stock:[],entries:[],orders:[],moves:[]},KEYS={users:'users',sites:'sites',materials:'mats',stock:'stock',entries:'entries',orders:'orders',moves:'moves'};
const loaded={};let db=null,me=null,tab='raport',lastKey='',rowsSig='',draft=[{code:'',qty:''}],authTab='in',crew=[{id:'',hours:''}],editId=null,warned='',openSite=null,openEmp=null,openMat=null,rmode='emp';
const today=()=>new Date().toISOString().slice(0,10);
const sget=()=>{try{return localStorage.getItem('u')}catch(e){return null}};
const sset=v=>{try{v?localStorage.setItem('u',v):localStorage.removeItem('u')}catch(e){}};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const isAdmin=()=>me&&me.role==='admin';
const mat=c=>S.mats.find(m=>m.code===c);
const locName=l=>l==='dep'?'Depozit':(S.sites.find(s=>s.id===l)||{}).name||l;
const qtyAt=(c,l)=>(S.stock.find(r=>r.id===sid(c)+'__'+l)||{}).qty||0;
const totQ=c=>S.stock.filter(r=>r.code===c).reduce((a,r)=>a+r.qty,0);
const legacy=m=>fmt((m.ordered||0)-S.orders.filter(o=>o.code===m.code).reduce((a,o)=>a+Math.max(0,o.qty-o.rec),0));
const recvOpts=()=>{const l=openOrders().map(o=>[o.id,o.no+' — '+o.code+' '+mat(o.code).name+': rămas '+fmt(o.qty-o.rec)+' '+mat(o.code).unit]);S.mats.forEach(m=>{const q=legacy(m);if(q>1e-9)l.push(['leg::'+m.code,'Fără număr — '+m.code+' '+m.name+': rămas '+fmt(q)+' '+m.unit])});return l};
const openOrders=()=>S.orders.filter(o=>o.qty-o.rec>1e-9&&mat(o.code)).sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no));
function ordRow(c){const m=mat(c),os=S.orders.filter(o=>o.code===c).sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no));
  const open=os.reduce((a,o)=>a+Math.max(0,o.qty-o.rec),0),leg=fmt((m.ordered||0)-open);
  if(!os.length&&!(leg>0))return '';
  return `<tr><td></td><td colspan="9" class="mut" style="white-space:normal"><b>Comenzi:</b> ${os.map(o=>`<b>${esc(o.no)}</b> (${esc(o.date)}): comandat ${fmt(o.qty)}, recepționat ${fmt(o.rec)}${(o.docs||[]).length?' ('+o.docs.map(d=>esc(d.doc)).join('; ')+')':''}, rămas ${fmt(Math.max(0,o.qty-o.rec))} ${esc(m.unit)}`).join(' · ')}${leg>0?(os.length?' · ':'')+'fără nr. comandă: '+leg+' '+esc(m.unit):''}</td></tr>`}
const used=(c,site)=>S.entries.filter(e=>e.site===site).reduce((a,e)=>a+(e.mats||[]).filter(m=>m.code===c).reduce((b,m)=>b+m.qty,0),0);
async function setStock(c,l,delta){await db.collection('stock').doc(sid(c)+'__'+l).set({code:c,loc:l,qty:fmt(qtyAt(c,l)+delta)})}
async function logMove(o){await db.collection('moves').doc('m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({date:today(),ts:new Date().toISOString(),...o})}
async function applyDeltas(list){const m={};list.forEach(([c,l,d])=>{const k=c+'\u0001'+l;m[k]=(m[k]||0)+d});for(const k in m){const [c,l]=k.split('\u0001');if(m[k])await setStock(c,l,m[k])}}
function fill(el,items,ph){if(!el)return;const v=el.value;el.innerHTML=(ph!=null?`<option value="">${esc(ph)}</option>`:'')+items.map(i=>`<option value="${esc(i[0])}">${esc(i[1])}</option>`).join('');if([...el.options].some(o=>o.value===v))el.value=v}
const siteOpts=()=>S.sites.map(s=>[s.id,s.name]);
const matOpts=()=>S.mats.map(m=>[m.code,m.code+' — '+m.name+' ('+m.unit+')']);
const locOpts=()=>[['dep','Depozit'],...siteOpts()];

function dlg(title,fields,okText,msg){return new Promise(res=>{
  const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99';
  o.innerHTML=`<div class="card" style="max-width:420px;width:100%;margin:0"><h2>${esc(title)}</h2>${msg?`<p>${esc(msg)}</p>`:''}${fields.map((f,i)=>`<label>${esc(f.label)}<input data-k="${i}" value="${esc(f.val??'')}"></label>`).join('')}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="sec" data-x="0">Anulează</button><button data-x="1">${esc(okText||'OK')}</button></div></div>`;
  document.body.appendChild(o);const ins=[...o.querySelectorAll('input')];if(ins[0])ins[0].focus();
  const done=v=>{o.remove();res(v)};
  o.onclick=e=>{const x=e.target.dataset.x;if(x==='0'||e.target===o)done(null);if(x==='1')done(ins.map(i=>i.value))};
  o.onkeydown=e=>{if(e.key==='Enter'&&ins.length)done(ins.map(i=>i.value));if(e.key==='Escape')done(null)};
})}
const yes=async(m,ok)=>(await dlg('Confirmare',[],ok||'Da',m))!==null;
const info=m=>dlg('Atenție',[],'OK',m);
async function init(){
  db=window.claude?await claude.use('db'):null;
  if(!db){app.innerHTML='<div class="card auth"><h2>Aplicația nu poate porni</h2><p class="mut">Deschide pagina din contul tău claude.ai, cu drept de editare.</p></div>';return}
  for(const n in KEYS)db.collection(n).onSnapshot(s=>{S[KEYS[n]]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[n]=1;if(n==='users'&&me)me=S.users.find(u=>u.id===me.id)||null;render()});
}

function render(){
  if(!loaded.users){app.innerHTML='<p class="mut">Se încarcă…</p>';return}
  if(!me){const sv=sget();if(sv)me=S.users.find(u=>u.id===sv)||null}
  if(!me){const k='auth'+authTab;if(lastKey!==k){authView();lastKey=k}return}
  if(tab==='users'&&!isAdmin())tab='raport';
  const k='main'+me.id+me.role+tab;
  if(lastKey!==k){shell();lastKey=k;rowsSig=''}
  data();
}
function authView(){
  const reg=authTab==='up';
  app.innerHTML=`<div class="card auth"><h1>Evidență Șantiere</h1>
  <div class="tabs" style="margin:12px 0"><button class="${reg?'':'on'}" data-a="at" data-v="in">Autentificare</button><button class="${reg?'on':''}" data-a="at" data-v="up">Cont nou</button></div>
  ${reg?'<label>Nume complet<input id="an"></label>':''}
  <label>Utilizator (login)<input id="au" autocomplete="username" autocapitalize="off"></label>
  <label>Parolă${reg?' (minim 6 caractere)':''}<input id="ap" type="password" autocomplete="${reg?'new-password':'current-password'}"></label>
  <p id="am" class="bad"></p><button data-a="${reg?'reg':'login'}" style="width:100%">${reg?'Creează cont':'Intră'}</button>
  ${reg&&!S.users.length?'<p class="mut">Primul cont creat devine administrator.</p>':''}</div>`;
}
function shell(){
  const tabs=[['raport','Raport zilnic'],['stoc','Stocuri'],['santiere','Șantiere'],['istoric','Istoric'],['rapoarte','Rapoarte'],...(isAdmin()?[['users','Utilizatori']]:[])];
  let body='';
  if(tab==='raport')body=`<div class="card"><h2 id="rtitle">Raport zilnic</h2>
  <div class="g"><label>Șantier<select id="rs"></select></label><label>Data<input type="date" id="rd" value="${today()}"></label></div><h3>Angajați și ore lucrate</h3><div id="rc"></div><button class="sec sm" data-a="addcrew">+ Angajat</button> <span id="rt" class="mut"></span>
  <label>Operațiuni efectuate<textarea id="ro" rows="4"></textarea></label>
  <h3>Materiale folosite</h3><div id="rm"></div><button class="sec sm" data-a="addrow">+ Material</button>
  <p id="rmsg"></p><button id="rsave" data-a="save">Salvează raportul</button> <button id="rcancel" class="sec" data-a="cancel" style="display:none">Renunță</button></div>`;
  if(tab==='stoc')body=`<div class="card"><div class="bar"><h2 style="margin:0">Evidența stocurilor</h2><select id="sf" style="width:auto"></select></div><div class="w" id="st"></div></div>
  ${isAdmin()?`<div class="card"><h3 style="margin-top:0">Material nou</h3><div class="g"><label>Cod<input id="mc"></label><label>Denumire<input id="mn"></label><label>U.M.<input id="mu" placeholder="buc, kg, m, sac"></label><label>Cantitate comandată<input id="mo" inputmode="decimal"></label></div><button data-a="addmat">Adaugă material</button>
  <h3>Intrare stoc</h3><div class="g"><label>Material<select id="im"></select></label><label>Locație<select id="il"></select></label><label>Cantitate<input id="iq" inputmode="decimal"></label><label>Document achiziție<select id="idt"><option value="">— alege —</option><option>Bon fiscal</option><option>Chitanță</option><option>Factură</option></select></label><label>Nr. document<input id="idn"></label></div><button data-a="addstock">Adaugă în stoc</button>
  <h3>Comandă material (adaugă în Comandată)</h3><div class="g"><label>Număr comandă<input id="cno" placeholder="ex: CMD-001 (opțional)"></label><label>Material<select id="com"></select></label><label>Cantitate<input id="coq" inputmode="decimal"></label></div><button data-a="order">Adaugă în Comandată</button>
  <h3>Recepție după număr de comandă (intră direct în Depozit și în Cant. actuală)</h3><div class="g"><label>Număr comandă<select id="rcm"></select></label><label>Cantitate primită<input id="rcq" inputmode="decimal" placeholder="implicit: tot ce a rămas"></label><label>Document achiziție<select id="rdt"><option value="">— alege —</option><option>Bon fiscal</option><option>Chitanță</option><option>Factură</option></select></label><label>Nr. document<input id="rdn"></label></div><button data-a="recv">Recepționează</button><p id="smsg"></p></div>`:''}<div class="card"><h3 style="margin-top:0">Mutare material între locații</h3><div class="g"><label>Material<select id="mm"></select></label><label>Din<select id="mf"></select></label><label>În<select id="mt"></select></label><label>Cantitate<input id="mq" inputmode="decimal"></label></div><button data-a="move">Mută</button><p id="smsg3"></p></div>`;
  if(tab==='santiere')body=`${isAdmin()?`<div class="card" id="sncard"><h2>Șantier nou</h2><div class="g"><label>Denumire șantier<input id="sn"></label></div><button data-a="addsite">Creează șantier</button></div>`:''}<div id="sg"></div>`;
  if(tab==='istoric')body=`<div class="card"><h2>${isAdmin()?'Toate rapoartele':'Rapoartele mele'}</h2><div id="ih"></div></div>`;
  if(tab==='rapoarte')body=`<div class="tabs"><button data-a="rm" data-v="emp">Raport angajați</button><button data-a="rm" data-v="mat">Raport materiale</button></div><div class="card"><h2 id="rtt"></h2><div class="g"><label id="lfe">Angajat<select id="fe"></select></label><label>Șantier<select id="fs"></select></label><label>De la<input type="date" id="fd1"></label><label>Până la<input type="date" id="fd2"></label><label id="lfm">Material<select id="fm"></select></label><label>Operațiune (conține)<input id="fo" placeholder="ex: zidărie"></label></div><button class="sec sm" data-a="csv">Descarcă CSV (Excel)</button><p id="rpm"></p></div><div class="card"><h2>Grafic și detalii</h2><div class="g"><label id="lcm">Măsoară<select id="cm"><option value="ore">Ore lucrate</option><option value="mat">Cantitate material folosit</option></select></label><label>Grupează după<select id="cg"><option value="emp">Angajat</option><option value="site">Șantier</option><option value="mat">Material</option><option value="day">Zi</option><option value="week">Săptămână</option><option value="month">Lună</option><option value="ops">Operațiune</option></select></label><label>Împarte pe (opțional)<select id="cg2"><option value="">— fără —</option><option value="emp">Angajat</option><option value="site">Șantier</option><option value="mat">Material</option><option value="day">Zi</option><option value="week">Săptămână</option><option value="month">Lună</option><option value="ops">Operațiune</option></select></label><label>Tip grafic<select id="ct"><option value="bar">Bare</option><option value="line">Linie</option><option value="pie">Plăcintă</option></select></label></div><div class="w" id="ch"></div><div class="w" id="cd" style="margin-top:10px"></div><button class="sec sm" data-a="svgdl">Descarcă imaginea (SVG)</button><p id="cmsg"></p></div><div id="rp"></div>`;
  if(tab==='users')body=`<div class="card"><h2>Utilizatori</h2><div class="w" id="ul"></div></div>`;
  app.innerHTML=`<div class="bar"><h1>Evidență Șantiere</h1><div><span class="mut">${esc(me.name)} · ${me.role==='admin'?'administrator':'angajat'}</span> <button class="sec sm" data-a="logout">Ieșire</button></div></div>
  <div class="tabs">${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
  const f=$('#sf');if(f)f.onchange=stTable;if(tab==='rapoarte'){$('#fd1').value=today().slice(0,8)+'01';$('#fd2').value=today();['#fe','#fs','#fd1','#fd2','#fm','#cm','#cg','#cg2','#ct'].forEach(s=>$(s).onchange=rap);$('#fo').oninput=rap}
}
function data(){
  if(tab==='raport'){fill($('#rs'),siteOpts(),'— alege șantierul —');$('#rtitle').textContent=editId?'Modifică raportul':'Raport zilnic';$('#rsave').textContent=warned?'Salvează oricâum':(editId?'Salvează modificările':'Salvează raportul');$('#rcancel').style.display=editId?'':'none';
    const sig=S.mats.map(m=>m.code).join()+'|'+S.users.map(u=>u.id).join()+'|'+draft.length+'|'+crew.length;if(sig!==rowsSig){rowsSig=sig;rows()}}
  if(tab==='stoc'){fill($('#sf'),[['*','Toate locațiile'],...locOpts()]);stTable();
    fill($('#mm'),matOpts());fill($('#mf'),locOpts());fill($('#mt'),locOpts());if(isAdmin()){fill($('#im'),matOpts());fill($('#il'),locOpts());fill($('#com'),matOpts());fill($('#rcm'),recvOpts())}}
  if(tab==='santiere')sites();
  if(tab==='istoric')hist();
  if(tab==='rapoarte'){fill($('#fe'),isAdmin()?[['*','Toți angajații'],...S.users.map(u=>[u.id,u.name])]:[[me.id,me.name]]);fill($('#fs'),[['*','Toate șantierele'],...siteOpts()]);fill($('#fm'),[['*','Toate materialele'],...S.mats.map(m=>[m.code,m.code+' — '+m.name])]);rap()}
  if(tab==='users')usersT();

  S.entries.forEach(e=>{if(fs!=='*'&&e.site!==fs)return;if(d1&&e.date<d1)return;if(d2&&e.date>d2)return;if(fo&&!(e.ops||'').toLowerCase().includes(fo))return;
    (e.mats||[]).forEach(m=>{if(!mat(m.code))return;if(fm!=='*'&&m.code!==fm)return;out.push({code:m.code,qty:m.qty,date:e.date,site:e.site,ops:e.ops})})});
  return out.sort((a,b)=>a.date.localeCompare(b.date))}

function rap(){

    const bad=[];if(!site)bad.push('șantierul');if(!date)bad.push('data');if(!cr.length&&!crew.some(c=>c.id||num(c.hours)))bad.push('cel puțin un angajat cu ore');if(!ops)bad.push('descrierea operațiunilor');crew.forEach((c,i)=>{if((c.id&&!(num(c.hours)>0))||(!c.id&&num(c.hours)>0))bad.push('angajatul de pe rândul '+(i+1)+' (alege angajatul ȘI scrie orele, mai mari ca 0)')});draft.forEach((r,i)=>{if((r.code&&!(num(r.qty)>0))||(!r.code&&num(r.qty)>0))bad.push('materialul de pe rândul '+(i+1)+' (alege materialul ȘI scrie cantitatea, sau șterge rândul cu ✕)')});
    if(bad.length)return say('#rmsg','Lipsește: '+bad.join('; ')+'.');
    if(new Set(cr.map(c=>c.id)).size<cr.length)return say('#rmsg','Un angajat apare de două ori.');
    const old=editId?S.entries.find(x=>x.id===editId):null;
    const avail=c=>qtyAt(c,site)+(old&&old.site===site?(old.mats||[]).filter(m=>m.code===c).reduce((s,m)=>s+m.qty,0):0);
    const need={};ms.forEach(m=>need[m.code]=(need[m.code]||0)+m.qty);
    const short=Object.keys(need).filter(c=>need[c]>avail(c)).map(c=>c+' (disponibil '+fmt(avail(c))+')');
    const sg=short.join('|');if(short.length&&warned!==sg){warned=sg;$('#rsave').textContent='Salvează oricâum';return say('#rmsg','Stoc insuficient pe șantier pentru: '+short.join(', ')+'. Apasă „Salvează oricâum” ca să continui (stocul va deveni negativ) sau mută/adaugă materialul înainte.')}
    short.length=0;
    if(short.length&&!confirm('Stoc insuficient pe șantier pentru: '+short.join(', ')+'. Salvezi oricum? Stocul va deveni negativ.'))return;
    await applyDeltas([...(old?(old.mats||[]).map(m=>[m.code,old.site,m.qty]):[]),...ms.map(m=>[m.code,site,-m.qty])]);
    await db.collection('entries').doc(editId||'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({user:old?old.user:me.id,userName:old?old.userName:me.name,site,date,hours:cr.reduce((a,c)=>a+c.hours,0),crew:cr,ops,mats:ms,ts:old?old.ts:new Date().toISOString()});
    const was=!!old;resetForm();say('#rmsg',was?'Raport modificat.':'Raport salvat.',1)}
  else if(a==='save_old'){
    const site=$('#rs').value,hours=num($('#rh').value),ops=$('#ro').value.trim(),date=$('#rd').value;
    const ms=draft.filter(r=>r.code&&num(r.qty)>0).map(r=>({code:r.code,qty:num(r.qty)}));
    if(!site||!date||hours<=0||!ops)return say('#rmsg','Alege șantierul, data, orele și descrie operațiunile.');
    const short=ms.filter(m=>m.qty>qtyAt(m.code,site)).map(m=>m.code+' (rămas '+fmt(qtyAt(m.code,site))+')');
    if(short.length&&!confirm('Stoc insuficient pe șantier pentru: '+short.join(', ')+'. Salvezi oricum? Stocul va deveni negativ.'))return;
    await db.collection('entries').doc('e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({user:me.id,userName:me.name,site,date,hours,ops,mats:ms,ts:new Date().toISOString()});
    for(const m of ms)await setStock(m.code,site,-m.qty);
    draft=[{code:'',qty:''}];$('#rh').value='';$('#ro').value='';rowsSig='';data();say('#rmsg','Raport salvat.',1)}
  }catch(err){console.error(err);const m=$('#rmsg')||$('#smsg')||$('#am');if(m)say('#'+m.id,'Eroare: '+(err.message||err))}
});
init();
</script></body></html>
